# Fedora Workstation Kickstart Configuration
# Extends base configuration with desktop environment packages

# Include base configuration
%include /tmp/ks-base.cfg

# Workstation-specific package selection
%packages --ignoremissing
# Base packages are included from ks-base.cfg
# Desktop Environment
@workstation-product-environment
@base-x
@fonts
@multimedia
@hardware-support

# Additional workstation tools
sudo
curl
wget
git
tmux
htop
net-tools
bind-utils
firefox
gedit
gnome-terminal
gnome-tweaks
dconf-editor

# Development tools (optional, comment out if not needed)
gcc
make
automake
kernel-devel

# Remove unnecessary packages
-plymouth
-biosdevname
-iprutils
%end

# Workstation-specific post-installation
%post --log=/root/ks-workstation-post.log
# Set graphical target as default
systemctl set-default graphical.target

# Additional workstation configuration can be added here
echo "Fedora Workstation image built with Packer" > /etc/workstation-info
%end
