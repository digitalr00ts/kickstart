# Fedora Server Kickstart Configuration
# Extends base configuration with server-specific packages

# Include base configuration
%include /tmp/ks-base.cfg

# Server-specific package selection
%packages --ignoremissing --excludedocs
# Base packages are included from ks-base.cfg
# Add server-specific packages here
sudo
curl
wget
git
tmux
htop
net-tools
bind-utils
tcpdump
lsof
rsync
-biosdevname
-iprutils
-plymouth
%end

# Server-specific post-installation
%post --log=/root/ks-server-post.log
# Additional server configuration can be added here
echo "Fedora Server image built with Packer" > /etc/server-info
%end
