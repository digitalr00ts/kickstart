# Fedora Base Kickstart Configuration
# Minimal configuration for automated installation

# Use text mode installation
text

# Accept EULA
eula --agreed

# System language
lang en_US.UTF-8

# Keyboard layout
keyboard --vckeymap=us --xlayouts='us'

# System timezone (UTC)
timezone UTC --utc

# Network configuration
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=fedora

# Root password (TEMPORARY - SECURITY WARNING)
# This password is for Packer provisioning only and should be:
# 1. Changed immediately after first boot, OR
# 2. Disabled by Ansible provisioning, OR
# 3. Replaced with SSH key-based authentication
# Password: packer (plaintext for automation)
rootpw --plaintext packer

# System authorization
authselect select minimal

# SELinux configuration
selinux --enforcing

# Firewall configuration
firewall --enabled --service=ssh

# Bootloader
bootloader --location=mbr --boot-drive=sda --timeout=5

# Clear the Master Boot Record
zerombr

# Clear all partitions
clearpart --all --initlabel

# Automatic partitioning
autopart --type=lvm

# Reboot after installation
reboot

# Package selection - minimal install
%packages --ignoremissing --excludedocs
@core
openssh-server
openssh-clients
python3
python3-pip
dnf
dnf-plugins-core
vim-minimal
bash-completion
-plymouth
%end

# Post-installation script
%post --log=/root/ks-post.log
# Enable SSH
systemctl enable sshd

# SECURITY NOTE: Allow root login via SSH (TEMPORARY for Packer provisioning)
# This should be disabled or restricted by Ansible after provisioning
sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config

# Ensure network is enabled on boot
systemctl enable NetworkManager

# Set Python3 as default python (needed for Ansible)
alternatives --set python /usr/bin/python3

# Update all packages
dnf update -y

# Clean DNF cache to save space
dnf clean all

# Clean temporary files
rm -rf /tmp/*
rm -rf /var/tmp/*

# Log completion
echo "Kickstart post-installation complete - system ready for Ansible provisioning"
%end
