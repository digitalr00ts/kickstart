# Minimal Fedora Base Kickstart Configuration

text
eula --agreed
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone America/Los_Angeles --utc
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=fedora

# Root password (TEMPORARY - SECURITY WARNING)
# This password is for Packer provisioning only and should be:
# 1. Changed immediately after first boot, OR
# 2. Disabled by Ansible provisioning, OR
# 3. Replaced with SSH key-based authentication
# Password: packer (plaintext for automation)
rootpw --lock

user --iscrypted --name admin --password $6$rounds=123456$kickstart$8BDRblt8lkOOA..4iCG/xJZR6L4nl2ZJxsZ9pkoK1ECbfqkZs60Gew6j2jvVCYSi9.e.hYGK2.S1v4ZG6zpBT/ --gecos Administrator --groups wheel
user --iscrypted --name vagrant --password $6$rounds=5000$default$L/jbIehFuDL9yFtCbhxk/DrduO/YwFORc8a3AT4.wx3WIFUeMHOS/ihM8uV7Ovi4p571WPJq70t0XJbAwBH83/ --gecos Vagrant --uid 900 --gid 900 --groups wheel

authselect select minimal
selinux --enforcing
firewall --enabled --service=ssh
bootloader --location=mbr --timeout=5
zerombr
clearpart --all --initlabel
autopart --type=btrfs
reboot

# %addon org_fedora_oscap
#   content-type = "ssg-fedora-ds.xml"
#   profile = "xccdf_org.ssgproject.content_profile_standard"
# %end

%packages --ignoremissing --excludedocs --exclude-weakdeps
@core
openssh-server
python3
python3-pip
dnf
dnf-plugins-core
vim-minimal
-plymouth

-@standard
-initial-setup-gui
-generic-release*
-glibc-all-langpacks
glibc-langpack-en
%end

# Post-installation script
%post --erroronfail --log=/root/ks-post.log

# Give Vagrant user permission to sudo w/o password.
printf -- 'Defaults:vagrant !requiretty\n%%vagrant ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/vagrant
chmod 440 /etc/sudoers.d/vagrant

# Set Python3 as default python (needed for Ansible)
# alternatives --set python /usr/bin/python3

# Clean up machine-specific data to ensure uniqueness on first boot
rm -f /var/lib/systemd/random-seed
rm -f /etc/machine-id
touch /etc/machine-id

# Configure dnf
cat >> /etc/dnf/dnf.conf <<EOF
install_weak_deps=False
fastestmirror=True
repo_gpgcheck=True
timeout=10
max_parallel_downloads=8
EOF

# Clean DNF cache to save space
dnf clean all

truncate -c -s 0 /var/log/dnf.log
truncate -c -s 0 /var/log/dnf.librepo.log
truncate -c -s 0 /var/log/dnf.rpm.log
echo "Packages within this image:"
echo "-----------------------------------------------------------------------"
rpm -qa
echo "-----------------------------------------------------------------------"
rm -f /var/lib/rpm/__db*

journalctl --vacuum-time=1s

# Clean temporary files
rm -rf /tmp/*
rm -rf /var/tmp/*

# Log completion
echo "Kickstart post-installation complete - system ready for Ansible provisioning"
%end
