---
# Ansible Playbook for Fedora Workstation Provisioning
# Applies workstation-specific configuration using drts01 collection

- name: Provision Fedora Workstation Image
  hosts: all
  become: true

  vars:
    # Fedora version passed from Packer
    # fedora_version: "{{ fedora_version }}"
    image_variant: "workstation"

  pre_tasks:
    - name: Display provisioning information
      ansible.builtin.debug:
        msg: |
          Provisioning Fedora {{ fedora_version | default('unknown') }} Workstation
          Using drts01 collection from: {{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') | default('default path') }}

    - name: Ensure system is up to date
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true
      tags: ['update']

    - name: Install common workstation packages
      ansible.builtin.dnf:
        name:
          - vim
          - git
          - curl
          - wget
          - firefox
          - gnome-tweaks
          - gnome-extensions-app
          - dconf-editor
        state: present
      tags: ['packages']

    - name: Install development tools
      ansible.builtin.dnf:
        name:
          - gcc
          - make
          - python3-devel
          - '@development-tools'
        state: present
      tags: ['packages', 'development']

  tasks:
    # Placeholder for drts01 collection roles
    # Once the collection structure is known, add role calls here
    # Example:
    # - name: Apply base workstation configuration
    #   ansible.builtin.include_role:
    #     name: drts01.collection.base

    # - name: Configure desktop environment
    #   ansible.builtin.include_role:
    #     name: drts01.collection.desktop

    # - name: Configure development environment
    #   ansible.builtin.include_role:
    #     name: drts01.collection.dev_tools

    - name: Placeholder - Configure workstation settings
      ansible.builtin.debug:
        msg: "Workstation provisioning tasks will be configured based on drts01 collection roles"

    - name: Enable and start GDM (GNOME Display Manager)
      ansible.builtin.systemd:
        name: gdm
        enabled: true
        state: started
      when: ansible_service_mgr == "systemd"
      tags: ['desktop']

  post_tasks:
    - name: Clean up DNF cache
      ansible.builtin.command: dnf clean all
      changed_when: true
      tags: ['cleanup']

    - name: Display completion message
      ansible.builtin.debug:
        msg: "Fedora {{ fedora_version | default('unknown') }} Workstation provisioning complete"
