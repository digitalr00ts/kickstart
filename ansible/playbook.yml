---
# Ansible Playbook for Fedora Minimal Image Provisioning
# Applies minimal configuration using drts01 collection

- name: Provision Fedora Minimal Image
  hosts: all
  become: true

  vars:
    # Fedora version passed from the build workflow
    # fedora_version: "{{ fedora_version }}"
    image_variant: minimal

  pre_tasks:
    - name: Display provisioning information
      ansible.builtin.debug:
        msg: |
          Provisioning Fedora {{ fedora_version | default("unknown") }} Minimal
          Using drts01 collection from: {{ lookup("env", "ANSIBLE_COLLECTIONS_PATH") | default("default path") }}

    - name: Ensure system is up to date
      ansible.builtin.dnf:
        name: '*'
        state: latest # noqa: package-latest
        update_cache: true
      tags: [update]

    - name: Install common minimal packages
      ansible.builtin.dnf:
        name:
          - vim
          - git
          - curl
          - wget
          - rsync
          - bind-utils
        state: present
      tags: [packages]

  tasks:
    # Placeholder for drts01 collection roles
    # Once the collection structure is known, add role calls here
    # Example:
    # - name: Apply base configuration
    #   ansible.builtin.include_role:
    #     name: drts01.collection.base

    - name: Placeholder - Configure minimal settings
      ansible.builtin.debug:
        msg: Minimal provisioning tasks will be configured based on drts01 collection roles

  post_tasks:
    - name: Clean up DNF cache
      ansible.builtin.command: dnf clean all
      changed_when: true
      tags: [cleanup]

    - name: Display completion message
      ansible.builtin.debug:
        msg: Fedora {{ fedora_version | default("unknown") }} Minimal provisioning complete
