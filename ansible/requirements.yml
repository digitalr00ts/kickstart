---
# Ansible Galaxy Requirements
# Specifies collections to install for image provisioning

collections:
  # drts01 Ansible Collection
  # Source: https://github.com/drts01/ansible-collection
  # 
  # For production builds: Uses GitHub as source
  # For local development: Comment out this entry and use ANSIBLE_COLLECTIONS_PATH
  #                        pointing to local collection directory
  - name: drts01.collection
    source: https://github.com/drts01/ansible-collection
    type: git
    version: main

# Usage:
#   Production (GitHub):
#     ansible-galaxy collection install -r requirements.yml
#   
#   Local Development:
#     export ANSIBLE_COLLECTIONS_PATH=/path/to/local/collections:~/.ansible/collections
#     # Then comment out the collection above or use --ignore-errors
