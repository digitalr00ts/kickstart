---
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        files: \.(yaml|yml|kiwi)$
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes

  # Share mise pins with direct CLI runs instead of installing duplicate hook binaries.
  - repo: local
    hooks:
      - id: typos
        name: Check spelling (typos)
        entry: mise exec -- typos --config .config/typos.toml --force-exclude
        language: system
        types: [text]
      - id: ryl
        name: Lint YAML (ryl)
        entry: mise exec -- ryl check --config-file .config/ryl.toml
        language: system
        files: \.(yaml|yml|kiwi)$
        stages: [manual] # target-stage: pre-commit; existing document markers, indentation and KIWI merge-key shadowing
      - id: ryl-format
        name: Check YAML formatting (ryl)
        entry: mise exec -- ryl format --check --config-file .config/ryl.toml
        language: system
        files: \.(yaml|yml|kiwi)$
        stages: [manual] # target-stage: pre-commit; existing YAML needs formatting
      - id: shuck
        name: Lint shell and workflow scripts (shuck)
        entry: mise exec -- shuck check
        language: system
        types_or: [shell, yaml]
        files: (\.sh$|^\.github/workflows/.*\.ya?ml$)
      - id: shuck-format
        name: Check shell formatting (shuck)
        entry: mise exec -- shuck format --check
        language: system
        types: [shell]
        stages: [manual] # target-stage: pre-commit; existing shell needs formatting
      - id: jactionlint
        name: Validate GitHub Actions (jactionlint)
        entry: mise exec -- jactionlint --shellcheck= --ruff=ruff
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: Audit GitHub Actions security (zizmor)
        entry: mise exec -- zizmor --offline
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [manual] # target-stage: pre-commit; checkout credentials and unpinned Fedora container
      - id: tombi
        name: Lint TOML (Tombi)
        entry: mise exec -- tombi lint --offline
        language: system
        files: (\.toml$)
      - id: tombi-format
        name: Check TOML formatting (Tombi)
        entry: mise exec -- tombi format --check --offline
        language: system
        files: (\.toml$)
        stages: [manual] # target-stage: pre-commit; existing TOML needs formatting
      - id: rumdl
        name: Check Markdown (rumdl)
        entry: mise exec -- rumdl check --config .config/rumdl.toml
        language: system
        types: [markdown]
        stages: [manual] # target-stage: pre-commit; existing tables and semantic line breaks
      - id: ruff
        name: Lint Python (Ruff)
        entry: mise exec -- ruff check
        language: system
        types: [python]
        stages: [manual] # target-stage: pre-commit; existing strict Ruff findings
      - id: ruff-format
        name: Check Python formatting (Ruff)
        entry: mise exec -- ruff format --check
        language: system
        types: [python]
        stages: [manual] # target-stage: pre-commit; existing Python needs formatting
      - id: kiwi
        name: Validate KIWI image descriptions
        entry: sh -ec 'for ARCH in x86_64 aarch64; do kiwi-ng --profile $ARCH image info --description kiwi; done'
        language: python
        additional_dependencies: ['kiwi[markup]']
        files: kiwi/.*\.kiwi$
        pass_filenames: false

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        args: [--fix]
        stages: [manual]

default_language_version:
  python: python3

exclude: |
  (?x)^(
    output/.*|
    .*\.box$|
    .*\.qcow2$|
    .*\.iso$|
    \.cline.*|
    openspec/.*|
    .*\.lock
  )$
