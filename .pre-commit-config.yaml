---
# Pre-commit hooks for Fedora Image Builder
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      # - id: check-symlinks
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=10240] # 10MB limit
      - id: check-case-conflict
      - id: check-executables-have-shebangs

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes

  # Shell script validation
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-s]

  # Ansible validation
  # - repo: https://github.com/ansible/ansible-lint
  #   rev: v26.4.0
  #   hooks:
  #     - id: ansible-lint
  #       args: [--fix]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.21.2
    hooks:
      - id: pyproject-fmt

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        additional_dependencies:
          - pyflakes
          - shellcheck-py

  # Packer validation
  - repo: local
    hooks:
      # Packer format check
      - id: packer-fmt
        name: Packer Format
        entry: packer fmt -recursive
        language: system
        files: \.pkr\.hcl$
        pass_filenames: false
        args: [packer/]

      # Packer validation
      - id: packer-validate
        name: Packer Validate
        entry: bash -c 'packer validate packer/'
        language: system
        files: packer/.*\.pkr\.hcl$
        pass_filenames: false

  # Kickstart validation (if ksvalidator is available)
  - repo: local
    hooks:
      - id: ksvalidator
        name: Validate Kickstart Configuration
        entry: ksvalidator
        language: python
        files: http/ks-base.*\.cfg$
        types: [file]
        additional_dependencies: [pykickstart]
        args: [--version=F44]

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--fix]
        files: \.(md|markdown)$

# Configuration for specific tools
default_language_version:
  python: python3

# Exclude patterns
exclude: |
  (?x)^(
    \.packer_cache/.*|
    output/.*|
    .*\.box$|
    .*\.qcow2$|
    .*\.iso$|
    \.cline.*|
    openspec/.*
  )$
