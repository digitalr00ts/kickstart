---
- name: Compute image and runtime values
  ansible.builtin.set_fact:
    host_arch_raw: "{{ lookup('pipe', 'uname -m') }}"
    guest_arch_default: >-
      {{ 'aarch64' if lookup('pipe', 'uname -m') in ['arm64', 'aarch64'] else 'x86_64' }}

- name: Resolve guest architecture
  ansible.builtin.set_fact:
    guest_arch: '{{ lookup(''env'', ''GUEST_ARCH'') | default(guest_arch_default, true) }}'

- name: Resolve Lima instance and state paths
  ansible.builtin.set_fact:
    lima_instance_name: molecule-fedora-{{ fedora_version }}-{{ variant }}
    lima_template_path: /tmp/molecule-lima-{{ fedora_version }}-{{ variant }}.yaml
    lima_state_path: /tmp/molecule-lima-{{ fedora_version }}-{{ variant }}.state
    spice_port: "{{ lookup('env', 'VM_SPICE_PORT') | default('5930', true) | int }}"

- name: Resolve image candidate paths
  ansible.builtin.set_fact:
    qemu_image_primary: >-
      output/qemu-{{ guest_arch }}-{{ variant }}/fedora-{{ fedora_version }}-{{ guest_arch }}-{{ variant }}
    qemu_image_legacy_v2: output/qemu-{{ variant }}/fedora-{{ fedora_version }}-{{ variant }}
    qemu_image_legacy: output/{{ variant }}/fedora-{{ variant }}

- name: Check primary image path
  ansible.builtin.stat:
    path: '{{ qemu_image_primary }}'
  register: qemu_primary_stat

- name: Check legacy v2 image path
  ansible.builtin.stat:
    path: '{{ qemu_image_legacy_v2 }}'
  register: qemu_legacy_v2_stat

- name: Check legacy image path
  ansible.builtin.stat:
    path: '{{ qemu_image_legacy }}'
  register: qemu_legacy_stat

- name: Resolve image path
  ansible.builtin.set_fact:
    image_path: >-
      {{
        qemu_image_primary if qemu_primary_stat.stat.exists
        else (qemu_image_legacy_v2 if qemu_legacy_v2_stat.stat.exists else qemu_image_legacy)
      }}

- name: Ensure image artifact exists
  ansible.builtin.stat:
    path: '{{ image_path }}'
  register: image_path_stat

- name: Fail when artifact is missing
  ansible.builtin.fail:
    msg: Image artifact not found at {{ image_path }}
  when: not image_path_stat.stat.exists

- name: Resolve absolute image path
  ansible.builtin.command:
    argv:
      - realpath
      - '{{ image_path }}'
  register: image_realpath
  changed_when: false

- name: Set absolute image path fact
  ansible.builtin.set_fact:
    image_path_absolute: '{{ image_realpath.stdout | trim }}'

- name: Include QEMU/KVM lifecycle tasks
  ansible.builtin.include_tasks: ../shared/instance-create-qemu-kvm.yml
  when: vm_platform == 'qemu-kvm'

- name: Include Lima lifecycle tasks
  ansible.builtin.include_tasks: ../shared/instance-create-lima.yml
  when: vm_platform == 'lima'
