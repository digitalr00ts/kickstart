---
- name: Resolve guest architecture for qemu
  ansible.builtin.set_fact:
    guest_arch: >-
      {{ lookup('env', 'GUEST_ARCH') |
      default('aarch64' if lookup('pipe', 'uname -m') in ['arm64', 'aarch64'] else 'x86_64',
      true) }}

- name: Stop qemu VM if running
  ansible.builtin.shell: |
    pid_file='/tmp/molecule-{{ vm_platform }}-{{ variant }}.pid'
    if [ -f "${pid_file}" ]; then
      pid="$(cat "${pid_file}")"
      if kill -0 "${pid}" >/dev/null 2>&1; then
        kill "${pid}" >/dev/null 2>&1 || true
        sleep 2
        kill -9 "${pid}" >/dev/null 2>&1 || true
      fi
      rm -f "${pid_file}"
    fi
  changed_when: true
  when: vm_platform == 'qemu'

- name: Power off and remove VirtualBox VM
  ansible.builtin.shell: |
    name=molecule-fedora-{{ fedora_version }}-{{ variant }}
    if VBoxManage showvminfo "${name}" >/dev/null 2>&1; then
      VBoxManage controlvm "${name}" poweroff >/dev/null 2>&1 || true
      sleep 2
      VBoxManage unregistervm "${name}" --delete >/dev/null 2>&1 || true
    fi
  changed_when: true
  when: vm_platform == 'virtualbox'
