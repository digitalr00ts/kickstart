[project]
name = "kickstart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "molecule>=26.4",
]

[dependency-groups]
dev = [
  "poethepoet>=0.35",
]

[tool.poe]
shell_interpreter = "bash"
tasks.build.help = "Build images with Packer"
tasks.build.shell = """
set -euo pipefail

[[ -n "${POE_EXTRA_ARGS:-}" ]] && eval "set -- ${POE_EXTRA_ARGS}" || set --

if [[ -n "${ARGS:-}" ]]; then
    read -r -a env_args <<< "${ARGS}"
    set -- "$@" "${env_args[@]}"
fi

packer build \
    -var="host_arch=$(uname -m)" \
    -var="host_os=$(uname -s)" \
    "$@" \
    "${PACKER_DIR:-packer}/"
"""
tasks.clean.help = "Remove build artifacts and Packer cache"
tasks.clean.cmd = "rm -rf ${OUTPUT_DIR:-output}/ .packer_cache/ ./*.box ./*.qcow2 ./*.vdi"
tasks.init.help = "Initialize Packer plugins"
tasks.init.cmd = "packer init -upgrade ${PACKER_DIR:-packer}/"
tasks.status.help = "Show output artifacts and Packer cache state"
tasks.status.shell = """
set -euo pipefail
source scripts/lib/common.sh

echo "==> Build Status"
echo
echo "Output directory: ${OUTPUT_DIR}"
if [[ -d "${OUTPUT_DIR}" ]]; then
    echo "Artifacts:"
    ls -lh "${OUTPUT_DIR}/"
else
    echo "No build artifacts found."
fi

echo
echo "Packer cache:"
if [[ -d ".packer_cache" ]]; then
    du -sh .packer_cache/
else
    echo "No Packer cache."
fi
"""
tasks.test.help = "Run tests: test [qemu|ansible-collection]"
tasks.test.args = [
  { name = "platform", positional = true, default = "qemu" },
]
tasks.test.shell = """
set -euo pipefail
source scripts/lib/common.sh

platform="${platform:-qemu}"
policy_mode="${MOLECULE_POLICY_MODE:-strict}"

case "$platform" in
    qemu|ansible-collection) ;;
    *) echo "Error: platform must be qemu or ansible-collection"; exit 1 ;;
esac

if [[ "$platform" == "ansible-collection" ]]; then
    require_cmd ansible
    require_cmd ansible-galaxy
    require_cmd python3

    [[ -f "ansible/requirements.yml" ]] || { echo "Error: ansible/requirements.yml not found"; exit 1; }
    [[ -f "ansible/ansible.cfg" ]] || { echo "Error: ansible/ansible.cfg not found"; exit 1; }

    grep -q collections_path ansible/ansible.cfg || echo "warn: collections_path not set in ansible/ansible.cfg"

    playbook="ansible/playbook.yml"
    [[ -f "${playbook}" ]] || { echo "Error: ${playbook} not found"; exit 1; }
    python3 - <<'PY' "${playbook}"
import sys, yaml
yaml.safe_load(open(sys.argv[1]))
PY
    echo "ok: yaml ${playbook}"

    if [[ -n "${ANSIBLE_COLLECTIONS_PATH:-}" && ! -d "${ANSIBLE_COLLECTIONS_PATH}" ]]; then
        echo "warn: ANSIBLE_COLLECTIONS_PATH does not exist: ${ANSIBLE_COLLECTIONS_PATH}"
    fi

    tmp="$(mktemp -d)"
    trap 'rm -rf "${tmp}"' RETURN
    ansible-galaxy collection install -r ansible/requirements.yml -p "${tmp}" --force >/dev/null 2>&1 \
        && echo "ok: galaxy install" \
        || echo "warn: galaxy install skipped/failed"

    grep -Eq 'hosts:' "${playbook}" || echo "warn: hosts missing: ${playbook}"
    grep -Eq 'tasks:|roles:' "${playbook}" || echo "warn: tasks/roles missing: ${playbook}"

    grep -r "drts01.collection" ansible/*.yml >/dev/null 2>&1 \
        && echo "ok: collection refs present" \
        || echo "warn: no drts01.collection refs"
    exit 0
fi

require_cmd molecule

if [[ "$platform" == "qemu" ]]; then
    setup_build_context
    MOLECULE_POLICY_MODE="$policy_mode" molecule test -s "qemu"
fi
"""
tasks.validate.help = "Validate Packer templates with host context"
tasks.validate.shell = "prek run --color=always --all-files --show-diff-on-failure packer-validate kickstart-validate"
