[project]
name            = "fedora-image-builder"
version         = "0.1.0"
description     = "Build and validate minimal Fedora base images for Ansible-managed infrastructure"
readme          = "README.md"
requires-python = ">=3.15,<4"
license         = "Apache-2.0"
classifiers     = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]

[dependency-groups]
build = [ "kiwi[markup]~=11.1" ]
docs  = [ "zensical>=0.1.3" ]
lint  = [ "ansible-lint==26.11.0" ]
test  = [ "molecule>=26.4" ]

[tool.ruff]
extend = ".config/ruff.toml"
