[project]
name = "fedora-image-builder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "molecule>=26.4" ]

[dependency-groups]
dev = [ "poethepoet>=0.35" ]

[tool.poe]
shell_interpreter = "bash"
tasks.build.help = "Build Fedora image with Kiwi NG (Lima on macOS, native on Linux)"
tasks.build.args = [
  { name = "version", positional = true, default = "44" },
  { name = "arch", positional = true, default = "" },
]
tasks.build.shell = "scripts/build-with-kiwi.sh ${version} ${arch}"
tasks.clean.help = "Remove all build artifacts"
tasks.clean.cmd = "rm -rf output/ build/ .kiwi-* ./*.qcow2"
tasks.test.help = "Run Molecule QEMU test scenario"
tasks.test.shell = """
set -euo pipefail
policy_mode="${MOLECULE_POLICY_MODE:-strict}"
MOLECULE_POLICY_MODE="$policy_mode" molecule test -s "qemu"
"""
