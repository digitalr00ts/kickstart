---
name: Test Kiwi NG Image

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      arch:
        description: Native architecture of the image
        default: x86_64
        type: choice
        options: [x86_64, aarch64]
      artifact_name:
        description: Exact image artifact name (empty selects the sole matching image)
        required: false
        type: string
      run_id:
        description: Successful Build run ID (empty finds the latest matching successful run)
        required: false
        type: string

permissions:
  contents: read
  actions: read

# Keep task execution within each job's explicit tool selection.
env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      IMAGE_ARCH: ${{ inputs.arch || 'x86_64' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configure VM diagnostic snapshots
        env:
          VM_LOG_DIR: ${{ runner.temp }}/vm-test-logs
        run: printf 'VM_LOG_DIR=%s\n' "$VM_LOG_DIR" >> "$GITHUB_ENV"

      - name: Select image from a successful Build run in this repository
        id: artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          REQUESTED_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
          REQUESTED_ARTIFACT: ${{ inputs.artifact_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const selectArtifact = require('./scripts/select-artifact.cjs');
            await selectArtifact({ github, context, core });

      - name: Download selected artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/

      - name: Install firmware and guest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ovmf qemu-efi-aarch64 libguestfs-tools zstd openssh-client

      - name: Install test tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.14
          install_args: uv qemu

      - name: Install project test dependencies
        run: uv sync --group test --frozen

      - name: Extract exactly one standalone image safely
        run: python3 .github/workflows/extract-image.py

      - name: Verify QCOW2 format and integrity
        id: integrity
        run: |
          qemu-img info --output=json "$IMAGE_PATH" > artifacts/image-info.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path('artifacts/image-info.json').read_text())
          if info.get('format') != 'qcow2' or info.get('backing-filename') or info.get('data-file'):
              raise SystemExit('Require a standalone QCOW2 image without external backing/data files')
          specific = info.get('format-specific', {}).get('data', {})
          if specific.get('data-file'):
              raise SystemExit('External QCOW2 data files are not allowed')
          PY
          qemu-img check "$IMAGE_PATH"

      - name: Select native QEMU accelerator
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$IMAGE_ARCH"
          # The Molecule runtime must honor QEMU_ACCEL, including the TCG fallback.
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'QEMU_ACCEL=kvm' >> "$GITHUB_ENV"
          else
            echo 'QEMU_ACCEL=tcg' >> "$GITHUB_ENV"
            echo 'KVM unavailable to this user; request QEMU TCG (slower).'
          fi

      - name: Run Molecule image tests
        id: molecule
        run: mise run test

      - name: Destroy Molecule resources
        id: cleanup
        if: always() && steps.molecule.outcome != 'skipped'
        run: uv run --group test --frozen molecule destroy -s qemu

      - name: Upload failed VM diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: vm-test-logs-${{ env.IMAGE_ARCH }}-${{ github.run_id }}
          path: |
            ${{ env.VM_LOG_DIR }}/console.log
            ${{ env.VM_LOG_DIR }}/supervisor.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Report actual test outcomes
        if: always()
        env:
          RUN_ID: ${{ steps.artifact.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          INTEGRITY_RESULT: ${{ steps.integrity.outcome }}
          MOLECULE_RESULT: ${{ steps.molecule.outcome }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
        run: |
          {
            printf '## Image test results\n\nBuild run: %s\n\nArtifact: %s\n' "$RUN_ID" "$ARTIFACT_NAME"
            printf '\nIntegrity: %s\n\nMolecule: %s\n' "$INTEGRITY_RESULT" "$MOLECULE_RESULT"
            printf '\nCleanup: %s\n\nRequested accelerator: %s\n' \
              "$CLEANUP_RESULT" "${QEMU_ACCEL:-not selected}"
          } >> "$GITHUB_STEP_SUMMARY"
