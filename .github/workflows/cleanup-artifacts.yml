---
name: Cleanup Old Artifacts

on:
  schedule:
    - cron: 0 2 * * 0
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (scheduled runs delete)
        default: true
        type: boolean
      retention_days:
        description: Optional global override (1–365 days); empty honors artifact expiry, fallback metadata 90/image 30
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Preview or delete expired artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const cleanup = require('./scripts/artifact-cleanup.cjs');
            await cleanup({ github, context, core });
