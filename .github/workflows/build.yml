---
name: Build

on:
  push:
    branches: [main, develop]
    paths:
      - kiwi/**
      - scripts/build.sh
      - scripts/export-image.sh
      - pyproject.toml
      - uv.lock
      - mise.toml
      - mise.lock
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
    paths:
      - kiwi/**
      - scripts/build.sh
      - scripts/export-image.sh
      - pyproject.toml
      - uv.lock
      - mise.toml
      - mise.lock
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      version:
        description: Fedora version
        default: '44'
        type: choice
        options: ['44']
      arch:
        description: Native architecture (not a cross-build)
        default: x86_64
        type: choice
        options: [x86_64, aarch64]

permissions:
  contents: read

# Keep task execution within each job's explicit tool selection.
env:
  MISE_AUTO_INSTALL: 'false'

jobs:
  build:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    # Unverified on hosted runners: privileged mode shares the host kernel and
    # still requires usable loop devices/mounts. This is not Fedora VM isolation.
    container:
      image: fedora:44
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      FEDORA_VERSION: ${{ inputs.version || '44' }}
      BUILD_ARCH: ${{ inputs.arch || 'x86_64' }}

    steps:
      - name: Install Fedora build dependencies
        run: dnf install -y git sudo tar zstd findutils kiwi-systemdeps jing python3

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install build tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78  # v5.3.0
        with:
          version: 2026.11.14
          install_args: uv

      - name: Check native architecture and loop support
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$BUILD_ARCH"
          # Do not detach host loops or remove runner tools to make space.
          losetup --find
          df -h .

      - name: Build image
        run: mise run build "$FEDORA_VERSION" "$BUILD_ARCH"

      - name: Package exactly one image and optional package manifests
        id: package
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=("output/$BUILD_ARCH/"*.qcow2)
          if (( ${#images[@]} != 1 )); then
            printf 'Expected one QCOW2 in output/%s, found %s\n' "$BUILD_ARCH" "${#images[@]}" >&2
            exit 1
          fi
          image=${images[0]}
          artifact="fedora-${FEDORA_VERSION}-${BUILD_ARCH}-${GITHUB_SHA:0:8}"
          manifests=("output/$BUILD_ARCH/"*.packages)
          members=("$(basename "$image")")
          for manifest in "${manifests[@]}"; do
            members+=("$(basename "$manifest")")
          done
          tar -C "output/$BUILD_ARCH" -I 'zstd -T0 -3' -cf "$artifact.tar.zst" -- "${members[@]}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          export IMAGE_FILE="$image" ARTIFACT_NAME="$artifact"
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          image = Path(os.environ['IMAGE_FILE'])
          metadata = {
              'fedora_version': os.environ['FEDORA_VERSION'],
              'architecture': os.environ['BUILD_ARCH'],
              'commit_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'build_time': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'image_name': image.name,
              'image_size_bytes': image.stat().st_size,
              'artifact_name': os.environ['ARTIFACT_NAME'],
              'builder_environment': 'privileged fedora:44 container',
          }
          Path('build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}.tar.zst
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: build-metadata-${{ env.BUILD_ARCH }}-${{ github.sha }}
          path: build-metadata.json
          if-no-files-found: error
          retention-days: 90

      - name: Report build status
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          {
            printf '## Build\n\nStatus: %s\n\nNative architecture: %s\n' "$BUILD_STATUS" "$BUILD_ARCH"
            printf '\nEnvironment: privileged Fedora 44 container.\n'
            printf 'Hosted-runner loop-device compatibility requires runtime validation.\n'
          } >> "$GITHUB_STEP_SUMMARY"
