---
name: CI

on: [push, pull_request]

permissions:
  contents: read

# Keep task execution within each job's explicit tool selection.
env:
  MISE_AUTO_INSTALL: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.sha }}
  cancel-in-progress: true

jobs:
  regression:
    name: Host regression (${{ matrix.os }}, no VM)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install regression tools
        uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
          install_args: uv node
      - name: Test host and workflow helpers (no image build or VM)
        run: mise run check-all


  prek:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Jing  # RELAX NG validator for KIWI image descriptions
        run: |
          sudo apt-get update
          sudo apt-get install -y jing
      - name: Install lint tools
        uses: jdx/mise-action@v5.3.0
        with:
          version: 2026.11.14
          install_args: uv prek ruff node jactionlint tombi rumdl ryl shuck zizmor typos
      - name: Run pre-commit
        run: mise run lint
