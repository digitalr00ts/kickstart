---
name: CI

on: [push, pull_request]

permissions:
  contents: read

# Keep task execution within each job's explicit tool selection.
env:
  MISE_AUTO_INSTALL: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.sha }}
  cancel-in-progress: true

jobs:
  regression:
    name: Host regression (${{ matrix.os }}, no VM)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install regression tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.14'
          install_args: uv node
      - name: Test host and workflow helpers (no image build or VM)
        run: mise run check-all

  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Jing  # RELAX NG validator for KIWI image descriptions
        run: |
          sudo apt-get update
          sudo apt-get install -y jing
      - name: Install lint tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.14'
          install_args: uv prek ruff node jactionlint tombi rumdl ryl shuck zizmor
      - name: Run pre-commit
        run: mise run lint
