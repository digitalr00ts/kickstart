---
base: template:fedora
vmType: vz
mountType: virtiofs
cpus: 4
memory: 4GiB
disk: 40GiB
env:
  UV_PROJECT_ENVIRONMENT: /opt/kiwi-build/.venv
mounts:
  - location: '~'
    writable: true
user:
  name: lima
provision:
  - mode: system
    script: |
      #!/usr/bin/env bash

      set -euo pipefail


      dnf install -y kiwi-systemdeps uv libguestfs-tools-c

      # Keep Linux environments and disk staging off the macOS shared filesystem.
      install -d -o lima -g lima -m 0755 /opt/kiwi-build /opt/kiwi-build/output
