---
base: template:fedora
env:
  UV_PROJECT_ENVIRONMENT: /opt/.venv.kiwi-builder
  OUTPUT_DIR: /opt/output
disk: 50GiB
mounts:
  - location: '~'
    writable: true
provision:
  - mode: system
    script: |
      #!/bin/bash

      set -eux -o pipefail

      cat >> /etc/dnf/dnf.conf <<EOF
      install_weak_deps=False
      fastestmirror=True
      repo_gpgcheck=True
      timeout=10
      max_parallel_downloads=8
      EOF

      dnf update -y
      dnf install -y dnf-plugin-versionlock kiwi-systemdeps uv
      uv sync --group build --frozen
